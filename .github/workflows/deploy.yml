name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/push-github-repository-aajhq6
  workflow_dispatch:

# Least privilege for the build; Pages deploy needs pages+id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The github-pages environment only accepts deployments from the
    # repository's default branch. Follow whatever that currently is, so a
    # push to any other branch skips cleanly instead of failing at the gate.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
